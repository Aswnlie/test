<h1>Movies</h1>
<p>Choose a movie to read more about it.</p>
{{#if user}}
  <p><a href="/movies/add">Add movie</a></p>
{{else}}
  <p><a href="/login">Log in to add a movie</a></p>
{{/if}}
<p id="status" role="status" aria-live="polite">Loading movies...</p>
<button id="retry" type="button" hidden>Try again</button>
<noscript><p>Enable JavaScript to load the movie list.</p></noscript>
<section aria-label="Movie list" id="movies"></section>
<template id="movie-card">
  <article>
    <img src="/images/poster-placeholder.svg" width="200" height="300" loading="lazy" alt="">
    <h2></h2>
    <p data-year></p>
    <p><span data-date-label></span> <time></time></p>
    <a>Details</a>
    <button type="button" hidden>Delete</button>
  </article>
</template>
